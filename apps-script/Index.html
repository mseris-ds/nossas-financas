<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<title>Nossas Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: sidebar fixa + painel em grade (2/3 esquerda: guardado, mural, cartões; 1/3 direita: contas a pagar, moradia) + faixa inteira com o guardado mês a mês */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --surface-2:#f5f6f9; --surface-3:#eceef3; --line:#e9ebf0;
  --fg:#101217; --fg-2:#3b404c; --muted:#6c7280; --faint:#a1a6b2;
  --blue:#2563eb; --blue-soft:#e8effe; --navy:#1e3a8a;
  --nu:#8a19d6; --nu-soft:#efe3fb; --inter:#ff7a00; --inter-soft:#ffeedd;
  --green:#16a34a; --green-soft:#e3f6ea; --amber:#c27803; --amber-soft:#fdf3d7; --red:#dc2626; --red-soft:#fde8e8;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.03);
  color-scheme:light;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
 *{box-sizing:border-box}
[hidden]{display:none!important}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--faint) 70%,transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--faint) 60%,transparent);border-radius:999px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--faint);background-clip:padding-box}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-corner{background:transparent}
html,body{min-height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
input,select{font:inherit;color:var(--fg)}
.app{display:grid;grid-template-columns:228px minmax(0,1fr);gap:20px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1640px;margin:0 auto}

.side{position:sticky;top:16px;height:calc(100vh - 32px);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 12px 12px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.duo{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;border:2px solid var(--surface);flex:none}
.av.eu{background:var(--blue)} .av.ela{background:#f43f6b}
.duo .av+.av{margin-left:-8px}
.brand b{display:block;font-size:13px;font-weight:700}
.brand small{font-size:11.5px;color:var(--muted)}
.navlbl{font-size:11px;color:var(--muted);padding:14px 10px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--fg-2);font-size:13px;font-weight:500;text-align:left}
.nav button svg{width:16px;height:16px;color:var(--muted);flex:none}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--surface-2);color:var(--fg);font-weight:600}
.nav button.on svg{color:var(--blue)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.theme{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;font-size:13px;color:var(--fg-2)}
.theme span{display:flex;align-items:center;gap:10px}
.theme svg{width:16px;height:16px}
.seg2{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg2 button{width:26px;height:24px;border-radius:999px;display:grid;place-items:center;color:var(--muted)}
.seg2 button svg{width:14px;height:14px}
.seg2 button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.me{border-top:1px solid var(--line);padding:12px 6px 2px;display:flex;align-items:center;gap:10px}
.me b{display:block;font-size:13px}
.me small{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}
.dot.g{background:var(--green)} .dot.a{background:var(--amber)} .dot.r{background:var(--red)}
.dot.nubank{background:var(--nu)} .dot.inter{background:var(--inter)} .dot.none{background:var(--faint)}
.menu{position:absolute;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.14);padding:6px;min-width:200px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;text-align:left}
.menu button:hover{background:var(--surface-2)}
.menu .ttl{font-size:11px;color:var(--muted);padding:6px 10px 4px}

.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);min-width:0;position:relative}
.top{display:flex;align-items:center;gap:14px;padding:14px 16px 14px 22px}
.arrows{display:flex;gap:4px}
.ib{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--fg-2)}
.ib:hover{background:var(--surface-2)}
.ib svg{width:16px;height:16px}
.month{display:flex;align-items:center;gap:6px;font-size:26px;font-weight:700;letter-spacing:-.02em;position:relative}
.month .yr{color:var(--muted);font-weight:600}
.month svg{width:16px;height:16px;color:var(--muted)}
.month .menu{top:calc(100% + 8px);left:0;font-size:13px;letter-spacing:0;max-height:320px;overflow:auto}
.month .menu button.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.top .sp{flex:1}
.bell{position:relative;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center}
.bell svg{width:17px;height:17px}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:999px;background:#ef2b45;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--surface)}
.bellwrap{position:relative}
.bellwrap .menu{right:0;top:calc(100% + 8px);min-width:290px}
.nrow{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;font-size:13px;border-radius:8px}
.nrow small{display:block;color:var(--muted);font-size:11.5px}
.nrow.late small{color:var(--red)}
.addgrp{display:flex;position:relative}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:12px;font-weight:600;font-size:13px}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.addgrp .btn.pri{border-radius:12px 0 0 12px}
.addgrp .btn.pri.caret{width:36px;padding:0;justify-content:center;border-radius:0 12px 12px 0;box-shadow:inset 1px 0 0 rgba(255,255,255,.28)}
.addgrp .caret svg{width:14px;height:14px}
.addgrp .menu{right:0;top:calc(100% + 8px)}
.btn.out{border:1px solid var(--line);background:var(--surface);height:34px;padding:0 12px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.btn.out:hover{background:var(--surface-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--red)}

.dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.dl .span2{grid-column:1/-1}
.dr{display:flex;flex-direction:column;gap:16px}
.h{font-size:14px;font-weight:600}
.h small{font-size:12px;color:var(--muted);font-weight:500}
.lbl{font-size:12px;color:var(--muted)}
.ill{position:absolute;top:14px;right:18px;width:112px;height:100px;pointer-events:none}
.ill svg{width:100%;height:100%;display:block}

.big{display:flex;align-items:baseline;gap:6px;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.big .cur{color:var(--muted);font-weight:700}
.big .int{font-weight:800;color:var(--fg)}
.big .cts{color:var(--muted);font-weight:500;font-size:.48em;margin-left:-4px;letter-spacing:0}
.big.xl{font-size:62px} .big.lg{font-size:34px} .big.md{font-size:26px}
.big.neg .int{color:var(--red)}

.saldo{padding-bottom:18px}
.saldo-row{display:flex;align-items:center;gap:22px;margin-top:30px;flex-wrap:wrap;padding-right:150px}
.saldo-note{border-left:1px solid var(--line);padding-left:16px;display:flex;flex-direction:column;gap:4px;max-width:330px}
.saldo-note b{display:flex;align-items:center;gap:6px;color:var(--green);font-weight:600;font-size:13.5px}
.saldo-note b.neg{color:var(--red)}
.saldo-note b svg{width:14px;height:14px}
.saldo-note span{font-size:12.5px;color:var(--muted);line-height:1.4}
.sbar{display:flex;gap:3px;height:10px;margin-top:34px}
.sbar i{display:block;height:100%;border-radius:3px;min-width:3px}
.legend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:16px}
.legend .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .k .dot{width:7px;height:7px}
.legend .v{font-size:14px;font-weight:600;margin-top:6px;display:flex;align-items:baseline;gap:5px;white-space:nowrap;flex-wrap:wrap}
.legend .v small{font-size:11px;color:var(--muted);font-weight:500}
.legend .v.g{color:var(--green)} .legend .v.r{color:var(--red)}
.pen{color:var(--muted);display:inline-grid}
.pen svg{width:12px;height:12px}
.prev{font-size:10px;font-weight:600;color:var(--amber);background:var(--amber-soft);padding:1px 6px;border-radius:999px;margin-left:2px}

.div-top{margin-top:30px}
.who{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
.who .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.who .v{font-size:15px;font-weight:600;margin-top:4px}
.who>div:last-child{text-align:right}
.who>div:last-child .k{justify-content:flex-end}
.splitbar{position:relative;display:flex;height:26px;margin-top:10px}
.splitbar>span{display:flex;align-items:center;color:#fff;font-size:11px;font-weight:700;padding:0 10px;height:100%;overflow:hidden;white-space:nowrap}
.splitbar>span:first-child{border-radius:7px 0 0 7px}
.splitbar>span:last-of-type{border-radius:0 7px 7px 0;justify-content:flex-end}
.splitbar>span:only-of-type{border-radius:7px}
.splitbar .mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--fg);border-radius:2px;transform:translateX(-1px)}
.bg-nubank{background:var(--nu)} .bg-inter{background:var(--inter)} .bg-none{background:var(--faint)}
.sub{font-size:12px;font-weight:600;margin-top:26px;margin-bottom:6px}
.rows{display:flex;flex-direction:column}
.rows .r{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.rows .r:last-child{border-bottom:0}
.rows .r .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows .r .n small{color:var(--muted);font-size:11px;margin-left:6px}
.rows .r .val{font-weight:600}
.rows.scroll{max-height:300px;overflow:auto}
.foot{margin:18px -22px -22px;border-top:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px}
.foot .t{flex:1;min-width:150px;color:var(--fg-2)}
.foot .t b{font-weight:700;color:var(--fg)}

.cards-head{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.cnav{display:flex;gap:6px}
.cnav button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--fg-2)}
.cnav button svg{width:12px;height:12px}
.track{display:flex;gap:12px;margin:16px -22px 0 0;overflow:hidden}
.cc{flex:none;width:calc(100% - 92px);aspect-ratio:1.58;max-height:206px;border-radius:12px;padding:16px 16px 18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;text-align:left}
.cc::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.cc.nubank{background:linear-gradient(135deg,#3b0a69 0%,#7a0fc6 48%,#4b0c85 100%)}
.cc.inter{background:linear-gradient(135deg,#ff6a00 0%,#ff8a1f 60%,#f06100 100%)}
.cc.outro{background:linear-gradient(135deg,#2a2d34,#4a4e57 55%,#1c1e23)}
.cc .row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;gap:8px}
.cc .bank{font-weight:800;font-size:16px;letter-spacing:-.02em}
.cc .pill{background:rgba(255,255,255,.2);font-size:10px;font-weight:600;padding:3px 9px;border-radius:999px}
.cc .emv{width:34px;height:26px;display:block}
.cc .nm{letter-spacing:.42em;font-size:12px;font-weight:600;opacity:.92}
.cc .nfc{width:18px;height:18px;opacity:.9}
.cc .ft{font-size:9px;letter-spacing:.08em;opacity:.75;text-transform:uppercase}
.cc .fv{font-size:13px;font-weight:600;margin-top:3px}
.cc.peek{width:92px;padding:16px 12px 18px;cursor:pointer}
.peek .logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:9px;font-weight:800;background:rgba(255,255,255,.22)}
.fat-lbl{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:26px}
.fats{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;height:168px}
.fat{position:relative;border-radius:10px;background:var(--surface-2);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;padding:12px 6px 14px;text-align:center;overflow:hidden}
.fat .m{font-size:12px;font-weight:600;position:relative;z-index:2}
.fat .st{font-size:9.5px;font-weight:600;background:var(--blue-soft);color:var(--blue);border-radius:4px;padding:2px 6px;margin-top:4px;position:relative;z-index:2}
.fat .st.pv{background:var(--amber-soft);color:var(--amber)}
.fat .fv{margin-top:auto;font-size:13.5px;color:var(--muted);font-weight:500;position:relative;z-index:2}
.fat.on{border-color:var(--blue);background:var(--surface)}
.fat.on .fv{color:var(--blue);font-weight:600}
.fat .area{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--blue) 22%,transparent),color-mix(in srgb,var(--blue) 4%,transparent));border-top:2px solid var(--blue);z-index:1}
.fats svg.ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.pt{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--muted);transform:translate(-50%,-50%);z-index:4;pointer-events:none}
.pt.on{border-color:var(--blue)}
.cnote{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.45}

.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:18px}
.chips.more{grid-template-columns:repeat(auto-fill,minmax(52px,1fr))}
.chip{border:1px solid var(--line);border-radius:12px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:600;font-size:14px;background:var(--surface)}
.chip .dots{display:flex;gap:2px;height:3px}
.chip .dots i{width:3px;height:3px;border-radius:50%;background:var(--faint)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on .dots i{background:#fff}
.chip.allpaid{color:var(--faint)}
.plist{margin-top:10px;max-height:300px;overflow:auto;-webkit-mask-image:linear-gradient(to bottom,#000 82%,transparent);mask-image:linear-gradient(to bottom,#000 82%,transparent);padding-bottom:22px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none;color:#fff}
.ck svg{width:12px;height:12px;opacity:0}
.ck:hover{border-color:var(--blue)}
.prow.paid .ck{background:var(--green);border-color:var(--green)}
.prow.paid .ck svg{opacity:1}
.prow .n{flex:1;min-width:0;font-weight:500}
.prow .n small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.prow .n small.late{color:var(--red)}
.prow.paid .n,.prow.paid .val{color:var(--faint);text-decoration:line-through}
.prow .val{font-weight:600}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hint button{color:var(--blue);font-weight:600}

.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:10px;padding:3px;margin-top:22px}
.seg button{height:30px;border-radius:8px;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.mbar{position:relative;margin-top:34px;height:18px;background:var(--surface-2);border-radius:5px}
.mbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.mbar .ref{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--fg);border-radius:2px}
.mbar .ref span{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--muted)}
.mscale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:14px}
.okline{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.okline b{color:var(--green);font-weight:600;display:flex;align-items:center;gap:4px}
.okline b.w{color:var(--amber)} .okline b.r{color:var(--red)}
.okline svg{width:13px;height:13px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:12px}
.mi{display:flex;align-items:center;gap:10px;min-width:0}
.mi .ico{width:34px;height:34px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.mi .ico svg{width:16px;height:16px}
.mi small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi b{font-size:13px;font-weight:600;white-space:nowrap}
.mi div{min-width:0}

.gchart{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:10px;align-items:end;margin-top:20px;height:190px;position:relative}
.gchart::before{content:"";position:absolute;left:0;right:0;bottom:28px;border-top:1px solid var(--line)}
.gcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;border-radius:10px;padding:0 2px;position:relative}
.gcol:hover .gb{filter:brightness(1.08)}
.gcol .gv{font-size:11px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.gcol .gb{width:100%;max-width:46px;border-radius:6px 6px 2px 2px;background:var(--green);min-height:3px}
.gcol .gb.neg{background:var(--red)}
.gcol .gb.pv{background:repeating-linear-gradient(135deg,var(--green) 0 5px,color-mix(in srgb,var(--green) 55%,transparent) 5px 10px)}
.gcol .gb.neg.pv{background:repeating-linear-gradient(135deg,var(--red) 0 5px,color-mix(in srgb,var(--red) 55%,transparent) 5px 10px)}
.gcol .gm{font-size:11.5px;color:var(--muted);height:22px;display:flex;align-items:center}
.gcol.on .gm{color:var(--blue);font-weight:700}
.gcol.on .gb{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--blue)}
.glegend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.glegend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px;background:var(--green)}

const mq=matchMedia("(max-width: 700px)");const isM=()=>mq.matches;
const S={data:null,erro:"",mes:TODAY,view:"visao",chip:null,cardIdx:0,fatSel:0,basis:"casal",sync:"load",canWrite:true,menu:null,pending:false};
function EMPTY(){return {v:2,pessoas:{eu:{nome:"Matheus"},ela:{nome:"Ana"}},salarios:{eu:{},ela:{}},
  cartoes:{nubank:{banco:"Nubank",estilo:"nubank",vence:null,ordem:1,faturas:{}},inter:{banco:"Inter",estilo:"inter",vence:null,ordem:2,faturas:{}}},
  contas:{},parcelas:{},pagos:{},reserva:{saldo:0,meta:0}}}
function norm(d){
  const e=EMPTY();d=JSON.parse(JSON.stringify(d||{}));
  for(const k of ["pessoas","salarios","cartoes","contas","parcelas","pagos","reserva"])if(!isObj(d[k]))d[k]=e[k];
  d.pessoas.eu=Object.assign({},e.pessoas.eu,d.pessoas.eu||{});d.pessoas.ela=Object.assign({},e.pessoas.ela,d.pessoas.ela||{});
  d.salarios.eu=d.salarios.eu||{};d.salarios.ela=d.salarios.ela||{};
  d.reserva=Object.assign({saldo:0,meta:0},d.reserva);
  return d;
}
const nome=q=>(S.data&&S.data.pessoas[q].nome)||(q==="eu"?"Matheus":"Ana");
const ini=q=>esc((nome(q)[0]||"?").toUpperCase());

/* lógica da planilha */
function val(map,m){let best=null;for(const k in map||{}){if(map[k]==null)continue;if(k<=m&&(best===null||k>best))best=k}return best?+map[best]:0}
const explicit=(map,m)=>{const v=(map||{})[m];return v==null?null:+v};
const lst=o=>Object.entries(o||{}).filter(([,v])=>isObj(v)).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(a.ordem||0)-(b.ordem||0)||String(a.nome||a.banco).localeCompare(String(b.nome||b.banco)));
const cartoes=()=>lst(S.data.cartoes);
const contas=()=>lst(S.data.contas);
const parcelas=()=>lst(S.data.parcelas);
const parcDo=(m,cid)=>parcelas().filter(p=>p.inicio<=m&&p.fim>=m&&(cid===undefined||(p.cartao||"")===cid));
function fatura(k,m){const l=explicit(k.faturas,m);const parc=sum(parcDo(m,k.id).map(p=>p.valor));if(l!=null&&l>0)return {valor:l,lancada:true,parc};return {valor:parc,lancada:false,parc}}
const mm={};
function mes(m){
  if(mm[m])return mm[m];
  const sal={eu:val(S.data.salarios.eu,m),ela:val(S.data.salarios.ela,m)};
  const E=sal.eu+sal.ela;
  const fats=cartoes().map(k=>Object.assign({k},fatura(k,m)));
  const cs=contas().map(c=>({c,valor:val(c.valores,m)}));
  const noCartao=cs.filter(x=>x.c.cartao),fixas=cs.filter(x=>!x.c.cartao);
  const D=sum(fats.map(f=>f.valor))+sum(cs.map(x=>x.valor));
  return mm[m]={m,sal,E,fats,cs,noCartao,fixas,D,saldo:E-D,prevista:fats.some(f=>!f.lancada)};
}
const guardado=m=>mes(addM(m,1));
function clearMemo(){for(const k in mm)delete mm[k]}

/* render */

  clearMemo();renderSide();
  const main=$("#main");
  if(!S.data){main.innerHTML=topBar(false)+(S.sync==="load"?`<div class="card empty"><p>Carregando seus dados…</p></div>`:S.sync==="err"?`<div class="card empty"><h2>Não deu para abrir os dados</h2><p>${esc(S.erro||"")}</p><p>Se você não é o dono, peça para ele compartilhar a planilha de dados com o seu e-mail como <b>Editor</b>.</p><button class="btn pri" style="margin-top:14px" data-act="recarregar">Tentar de novo</button></div>`:vEmpty());return}

  main.innerHTML=topBar(true)+V();
}

   <div class="ttl" style="display:flex;align-items:center;gap:6px"><i class="dot ${st[0]}"></i>${st[1]}</div></div>`:"");

function bellItems(){if(!S.data)return [];return pagarItens(TODAY).filter(x=>!x.pago&&x.data&&diffDays(x.data)<=7)}
function topBar(full){
  const opts=[];for(let i=-8;i<=8;i++)opts.push(addM(TODAY,i));
  const [y]=parts(S.mes);const notif=full?bellItems():[];
  return `<div class="card top">

   <div class="addgrp">${isM()?`<button class="addm" data-act="menu" data-m="add" aria-label="Adicionar" ${S.canWrite?"":"disabled"}>+</button>`:`<button class="btn pri" data-act="newparc" ${S.canWrite?"":"disabled"}>+ <span class="t">Adicionar</span></button><button class="btn pri caret" data-act="menu" data-m="add" aria-label="Mais opções" ${S.canWrite?"":"disabled"}>${I.down}</button>`}
   ${S.menu==="add"?`<div class="menu"><button data-act="newparc">Compra parcelada</button><button data-act="fatura">Lançar fatura</button><button data-act="newconta">Conta fixa</button><button data-act="go" data-v="renda">Salários</button></div>`:""}</div>`:""}
  </div>`;

/* visão geral */
function vVisao(){return `<div class="dash"><div class="dl">${wGuardado()}${wMural()}${wCartoes()}</div><div class="dr">${wPagar()}${wMoradia()}</div></div>${wAno()}`}
function wGuardado(){
  const M=S.mes,N=addM(M,1),g=guardado(M);
  const fNu=sum(g.fats.filter(f=>f.k.id==="nubank").map(f=>f.valor)),fIn=sum(g.fats.filter(f=>f.k.id!=="nubank").map(f=>f.valor));
  const pvNu=g.fats.some(f=>f.k.id==="nubank"&&!f.lancada),pvIn=g.fats.some(f=>f.k.id!=="nubank"&&!f.lancada);
  const extra=sum(g.noCartao.map(x=>x.valor)),fix=sum(g.fixas.map(x=>x.valor));
  const extraNome=g.noCartao.length===1?g.noCartao[0].c.nome:"Pagos no cartão";
  const exCor="color-mix(in srgb,var(--inter) 45%,var(--surface-3))";
  const segs=[[fNu,"var(--nu)"],[fIn,"var(--inter)"],[extra,exCor],[fix,"var(--navy)"],[Math.max(g.saldo,0),"var(--green)"]];
  const tot=Math.max(g.E,sum(segs.map(x=>x[0])))||1;const neg=g.saldo<0;
  const L=(k,dot,v,p,cls="",pv=false)=>`<div><div class="k">${dot}${k}</div><div class="v ${cls}">${v}${p!=null?`<small>· ${p}%</small>`:""}${pv?`<span class="prev">prevista</span>`:""}</div></div>`;
  return `<section class="card saldo span2"><div class="h">Dinheiro a ser guardado <small>• ciclo de ${nomeMes(M)}</small></div><div class="ill">${ILL.wallet}</div>
   <div class="saldo-row">${big(g.saldo,"xl")}<div class="saldo-note"><b class="${neg?"neg":""}">${neg?I.trendDown:I.trend}${g.E>0?pct(Math.abs(g.saldo),g.E)+"% dos salários "+(neg?"faltando":"livres"):"cadastre os salários"}</b><span>salários de ${nomeMes(N)} − tudo que vence em ${nomeMes(N)}, que inclui as faturas do que vocês gastaram no cartão em ${nomeMes(M)}</span></div></div>
   <div class="sbar">${segs.filter(x=>x[0]>0).map(x=>`<i style="width:${x[0]/tot*100}%;background:${x[1]}"></i>`).join("")||`<i style="width:100%;background:var(--surface-3)"></i>`}</div>
   <div class="legend">
    <div><div class="k">Salários de ${nomeMes(N)}</div><div class="v">${brl(g.E)} <button class="pen" data-act="go" data-v="renda" aria-label="Editar salários">${I.pen}</button></div></div>
    ${L("Nubank",`<i class="dot nubank"></i>`,"− "+brl(fNu),pct(fNu,g.E),"",pvNu)}
    ${L("Inter",`<i class="dot inter"></i>`,"− "+brl(fIn),pct(fIn,g.E),"",pvIn)}
    ${L(esc(extraNome),`<i class="dot" style="background:${exCor}"></i>`,"− "+brl(extra),pct(extra,g.E))}
    ${L("Contas fixas",`<i class="dot" style="background:var(--navy)"></i>`,"− "+brl(fix),pct(fix,g.E))}
    ${L("<b style='color:var(--fg);font-weight:600'>= Guardar</b>",`<i class="dot ${neg?"r":"g"}"></i>`,brl(g.saldo),pct(g.saldo,g.E),neg?"r":"g")}
   </div></section>`;
}

   ${vNone>0.005?`<div class="hint"><i class="dot none"></i>${brl(vNone)} em parcelas sem cartão definido, fora das faturas. <button data-act="go" data-v="mural">Escolher cartão</button></div>`:""}

  return `<div class="cc ${est}"><div class="row"><span class="bank">${esc(k.banco)}</span><span class="pill">${f.lancada?"Lançada":"Prevista"}</span></div>

   <div class="row" style="align-items:flex-end"><div><div class="ft">Vence</div><div class="fv">${ve}</div></div><div style="text-align:right"><div class="ft">Parcelas no mês</div><div class="fv">${brl(f.parc)}</div></div></div></div>`;
}
function wCartoes(){

    ${xs.map((x,j)=>`<i class="pt ${j===sel?"on":""}" style="left:${x}%;top:${ys[j]}px"></i>`).join("")}
   </div>
   <div class="cnote">${fs[sel].lancada?"Valor lançado por vocês.":"Prevista = só as parcelas do mural. Lance o valor real quando a fatura fechar."}${extra.length?` Além disso, ${extra.map(x=>esc(x.c.nome.toLowerCase())+" de "+brl(x.v)).join(", ")} vem nessa fatura e aparece separado.`:""}</div></section>`;

function pagarItens(m){
  const pagos=new Set(S.data.pagos[m]||[]);const out=[];
  cartoes().forEach(k=>{const f=fatura(k,m);const ex=contas().filter(c=>c.cartao===k.id).map(c=>({c,v:val(c.valores,m)})).filter(x=>x.v>0);const v=f.valor+sum(ex.map(x=>x.v));
    if(v>0)out.push({id:"fat-"+k.id,nome:"Fatura "+k.banco,sub:(f.lancada?"lançada":"prevista, só parcelas")+(ex.length?" · inclui "+ex.map(x=>x.c.nome.toLowerCase()).join(", "):""),valor:v,dia:k.vence,cor:k.id})});
  contas().filter(c=>!c.cartao).forEach(c=>{const v=val(c.valores,m);if(v>0)out.push({id:c.id,nome:c.nome,sub:"conta fixa",valor:v,dia:c.dia})});
  out.forEach(x=>{x.pago=pagos.has(x.id);x.data=x.dia?dateOf(m,x.dia):null});
  return out.sort((a,b)=>(a.pago-b.pago)||((a.data?+a.data:9e15)-(b.data?+b.data:9e15))||b.valor-a.valor);
}
function wPagar(){
  const list=pagarItens(S.mes);const total=sum(list.map(x=>x.valor));const pagas=list.filter(x=>x.pago).length;
  const datadas=list.filter(x=>x.data);
  const next=datadas.filter(x=>!x.pago).sort((a,b)=>a.data-b.data)[0];
  let when="";if(next){const dd=diffDays(next.data);when=dd<0?`<span style="color:var(--red)">atrasada há ${-dd} dia${-dd>1?"s":""}</span>`:dd===0?"vence hoje":`em ${dd} dia${dd>1?"s":""}`}else if(list.length&&pagas===list.length)when="tudo pago";
  const days=[...new Set(datadas.map(x=>x.data.getDate()))].sort((a,b)=>a-b);
  const nextDay=next?next.data.getDate():null;const act=S.chip!=null&&days.includes(S.chip)?S.chip:null;
  const shown=act!=null?list.filter(x=>x.data&&x.data.getDate()===act):list;
  return `<section class="card"><div class="h">Contas a pagar ${next?`<small>• dia ${pad(nextDay)}</small>`:""}</div><div class="ill" style="width:96px;height:86px">${ILL.calendar}</div>
   <div style="margin-top:18px">${big(total,"md")}</div>
   <div class="lbl" style="margin-top:8px">${when}${when?" · ":""}<b style="color:var(--fg-2);font-weight:600">${pagas} de ${list.length} pagas</b> em ${nomeMes(S.mes)}</div>
   ${days.length?`<div class="chips ${days.length>5?"more":""}">${days.map(dd=>{const it=datadas.filter(x=>x.data.getDate()===dd);const on=act!=null?dd===act:dd===nextDay;const allp=it.every(x=>x.pago);return `<button class="chip ${on?"on":""} ${allp&&!on?"allpaid":""}" data-act="chip" data-d="${dd}" aria-pressed="${act===dd}">${pad(dd)}<span class="dots">${it.slice(0,5).map(()=>"<i></i>").join("")}</span></button>`}).join("")}</div>`:`<div class="hint">Sem dias de vencimento cadastrados. <button data-act="go" data-v="contas">Adicionar dias</button></div>`}
   <div class="plist">${shown.length?shown.map(x=>{const dd=x.data?diffDays(x.data):null;const late=!x.pago&&dd!=null&&dd<0;return `<div class="prow ${x.pago?"paid":""}"><button class="ck" data-act="pay" data-id="${esc(x.id)}" aria-label="${x.pago?"Desmarcar":"Marcar como paga"}: ${esc(x.nome)}" ${S.canWrite?"":"disabled"}>${I.check}</button><span class="n">${x.cor?`<i class="dot ${x.cor}" style="margin-right:6px"></i>`:""}${esc(x.nome)}<small class="${late?"late":""}">${x.data?"dia "+pad(x.data.getDate())+" · ":""}${esc(x.sub)}${late?" · atrasada":""}</small></span><span class="val">${brl(x.valor)}</span></div>`}).join(""):`<div class="prow"><span class="n" style="color:var(--muted)">Nada a pagar neste mês.</span></div>`}</div>
  </section>`;
}

/* mural */

  const ms=[];let m=S.mes;while(m<=fimMax&&ms.length<14){ms.push(m);m=addM(m,1)}while(ms.length<6){ms.push(m);m=addM(m,1)}

  const totRow=(lab,vals,cls="tot")=>`<tr class="${cls}"><td class="lab">${lab}</td><td></td>${vals.map(v=>`<td class="num">${v?brl(v):""}</td>`).join("")}</tr>`;
  return `<section class="card"><div class="pagehead"><div><h2>Mural da vergonha</h2><p>Compras parceladas. Cada parcela entra sozinha na fatura do cartão no mês certo. Toque numa linha para editar.</p></div>${S.canWrite?`<button class="btn pri" data-act="newparc">+ Compra parcelada</button>`:""}</div>

  ${ativos.map(p=>`<tr class="click" data-act="editparc" data-id="${esc(p.id)}"><td class="lab">${esc(p.nome)}</td><td>${p.cartao?`<span class="tag ${p.cartao}">${esc((S.data.cartoes[p.cartao]||{}).banco||p.cartao)}</span>`:`<span class="tag">sem cartão</span>`}</td>${ms.map(x=>p.inicio<=x&&p.fim>=x?`<td class="num pc-${p.cartao||"none"}">${brl(p.valor)}</td>`:"<td></td>").join("")}</tr>`).join("")||`<tr><td colspan="${ms.length+2}" style="color:var(--muted)">Nenhuma compra parcelada em aberto.</td></tr>`}
  ${totRow("TOTAL",ms.map(x=>sum(parcDo(x).map(p=>p.valor))))}

  return `<section class="card"><div class="pagehead"><div><h2>Nossa reserva</h2><p>Quanto o casal já tem guardado e quanto o plano atual deve somar.</p></div><div class="ill" style="position:static;width:90px;height:80px">${ILL.piggy}</div></div>

   <div style="margin-top:22px">${big(r.saldo,"lg")}</div><div class="lbl" style="margin-top:6px">${r.meta>0?`${Math.round(p)}% da meta de ${brl(r.meta)} · faltam ${brl(Math.max(0,r.meta-r.saldo))}`:"Defina uma meta para acompanhar."}</div>

  const cta=c=>{const e=explicit(c.valores,m);return mIn(esc(c.nome)+(c.cartao?` <span class="tag ${c.cartao}">${esc((S.data.cartoes[c.cartao]||{}).banco||"")}</span>`:""),`data-conta="${esc(c.id)}" data-m="${m}"`,e,e==null?val(c.valores,m)||null:null)};

   <p class="note">Guardar = salários de ${nomeMes(addM(m,1))} − despesas de ${nomeMes(addM(m,1))}, porque o cartão de ${nomeMes(m)} é pago no mês seguinte.</p>

/* modais */
function monthOpts(sel,from,to){let o="";for(let i=from;i<=to;i++){const k=addM(TODAY,i);o+=`<option value="${k}" ${k===sel?"selected":""}>${cap(nomeMes(k))} ${k.slice(0,4)}</option>`}if(sel&&!o.includes(`value="${sel}"`))o=`<option value="${sel}" selected>${cap(nomeMes(sel))} ${sel.slice(0,4)}</option>`+o;return o}
function nParc(a,b){const [y1,m1]=parts(a),[y2,m2]=parts(b);return (y2-y1)*12+(m2-m1)+1}

   <label class="fld">Valor da parcela<input id="mp-valor" name="valor" inputmode="decimal" value="${p.valor!=null?fmtIn(p.valor):""}" placeholder="0,00"></label>

function resumoParc(){const f=$("#fparc");if(!f)return;const v=parseBR(f.valor.value)||0;const n=Math.max(1,parseInt(f.n.value)||1);const ini=f.inicio.value;const fim=addM(ini,n-1);$("#mp-resumo").textContent=`${n}x de ${brl(v)} = ${brl(v*n)} · última parcela em ${nomeMes(fim)} de ${fim.slice(0,4)}`}

  S.menu=null;
  $("#ov").innerHTML=`<form class="modal" id="fconta" data-id="${esc(id||"")}"><h3>${ex?"Editar conta fixa":"Nova conta fixa"}</h3><p class="lbl">O valor vale a partir do mês escolhido e se repete até mudar.</p>
   <div class="fgrid"><label class="fld" style="grid-column:1/-1">Nome<input id="mc-nome" name="nome" required value="${esc(c.nome)}" placeholder="Ex.: Água"></label>

   <label class="fld">Pago no cartão<select id="mc-cartao" name="cartao"><option value="">Não, conta separada</option>${cartoes().map(k=>`<option value="${esc(k.id)}" ${c.cartao===k.id?"selected":""}>${esc(k.banco)} (mostrar separado)</option>`).join("")}</select></label>

   <div class="fgrid" id="ff-months">${ms.map(m=>{const e=explicit(k.faturas,m);return `<label class="fld">${cap(nomeMes(m))} ${m.slice(0,4)}<input id="ff-${m}" name="m-${m}" inputmode="decimal" value="${e&&e>0?fmtIn(e):""}" placeholder="${fmtIn(fatura(k,m).parc)} (parcelas)" ${S.canWrite?"":"disabled"}></label>`}).join("")}</div>
   <div class="mfoot"><span class="sp"></span><button type="button" class="btn out" data-act="close">${S.canWrite?"Cancelar":"Fechar"}</button>${S.canWrite?`<button type="submit" class="btn pri">Salvar</button>`:""}</div></form>`;
  $("#ov").hidden=false;
}
function closeModal(){$("#ov").hidden=true;$("#ov").innerHTML="";if(S.pending){S.pending=false;render()}}

/* persistência: Google Apps Script + planilha */
let versao=0,salvando=0,chain=Promise.resolve();
const gs=(fn,...a)=>new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...a)});
const msgErro=e=>String((e&&e.message)||e||"erro desconhecido");
function ocupado(){const ae=document.activeElement;return !$("#ov").hidden||(ae&&ae.closest&&ae.closest("#main")&&/INPUT|SELECT/.test(ae.tagName))}
function talvezRender(){if(ocupado()){S.pending=true;renderSide()}else render()}
function save(patch,replace){
  merge(S.data,patch);render();
  const body=JSON.stringify(replace?S.data:patch);
  salvando++;S.sync="saving";renderSide();
  chain=chain.then(()=>gs("salvar",body,!!replace)).then(r=>{const o=JSON.parse(r);versao=o.version;salvando--;if(!salvando){S.data=norm(o.data);S.sync="ok";talvezRender()}})
   .catch(e=>{salvando--;S.sync="err";renderSide();toast("Não deu para salvar: "+msgErro(e))});
}
async function carregar(){
  try{const o=JSON.parse(await gs("carregar"));versao=o.version;S.data=o.data?norm(o.data):null;S.sync="ok";talvezRender()}
  catch(e){S.erro=msgErro(e);S.sync="err";render()}
}
async function checar(){if(document.hidden||salvando||S.sync==="err")return;try{const v=await gs("versao");if(v!==versao)carregar()}catch(e){}}
function init(){
  try{const th=lsGet("theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
  render();carregar();
  setInterval(checar,20000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)checar()});
}

/* ações */
const VIEWS=["visao","fluxo","cartoes","mural","reserva","renda","contas"];
function go(v){S.view=v;S.menu=null;try{if(location.hash!=="#"+v)history.replaceState(null,"","#"+v)}catch(e){}render();window.scrollTo({top:0})}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(!b){if(S.menu&&!e.target.closest(".menu")){S.menu=null;render()}if(e.target.id==="ov")closeModal();return}
  const a=b.dataset.act;
  if(a!=="menu"&&S.menu&&!b.closest(".menu"))S.menu=null;
  switch(a){
    case "go":go(b.dataset.v);break;
    case "menu":S.menu=S.menu===b.dataset.m?null:b.dataset.m;render();break;
    case "mes":S.mes=addM(S.mes,+b.dataset.n);S.chip=null;S.fatSel=0;render();break;
    case "setmes":S.mes=b.dataset.k;S.menu=null;S.chip=null;S.fatSel=0;render();break;
    case "chip":{const d=+b.dataset.d;S.chip=S.chip===d?null:d;render();break}
    case "pay":{const id=b.dataset.id;const arr=(S.data.pagos[S.mes]||[]).slice();const i=arr.indexOf(id);if(i>=0)arr.splice(i,1);else arr.push(id);save({pagos:{[S.mes]:arr}});break}
    case "basis":S.basis=b.dataset.b;render();break;
    case "card":S.cardIdx+=+b.dataset.n;S.fatSel=0;render();break;
    case "fatsel":S.fatSel=+b.dataset.n;render();break;
    case "fatura":openFatura(b.dataset.card);render();break;
    case "newparc":if(!S.canWrite)return;openParc(null);render();break;
    case "editparc":if(!S.canWrite)return;openParc(b.dataset.id);break;
    case "newconta":if(!S.canWrite)return;openConta(null);render();break;
    case "editconta":openConta(b.dataset.id);break;
    case "close":closeModal();break;
    case "recarregar":S.sync="load";render();carregar();break;
    case "start":S.data=EMPTY();save({},true);break;
    case "delparc":{if(b.textContent!=="Confirmar exclusão"){b.textContent="Confirmar exclusão";break}const id=$("#fparc").dataset.id;closeModal();save({parcelas:{[id]:null}});toast("Compra excluída.");break}
    case "delconta":{if(b.textContent!=="Confirmar exclusão"){b.textContent="Confirmar exclusão";break}const id=$("#fconta").dataset.id;closeModal();save({contas:{[id]:null}});toast("Conta excluída.");break}
  }
});
document.addEventListener("input",e=>{if(e.target.closest&&e.target.closest("#fparc"))resumoParc()});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="fparc"){
    const nm=f.nome.value.trim();if(!nm){toast("Diga o que foi comprado.");return}
    const v=parseBR(f.valor.value);if(!v){toast("Informe o valor da parcela.");return}
    const n=Math.max(1,parseInt(f.n.value)||1);const ini=f.inicio.value;
    const id=f.dataset.id||("p"+uid());const ex=S.data.parcelas[id];
    const ordem=ex?ex.ordem:(Math.max(0,...parcelas().map(p=>p.ordem||0))+1);
    closeModal();save({parcelas:{[id]:{nome:nm,valor:v,inicio:ini,fim:addM(ini,n-1),cartao:f.cartao.value,ordem}}});toast(ex?"Compra salva.":"Compra adicionada ao mural.");
  }
  if(f.id==="fconta"){
    const nm=f.nome.value.trim();if(!nm){toast("Dê um nome para a conta.");return}
    const id=f.dataset.id||("c"+uid());const ex=S.data.contas[id];
    const v=parseBR(f.valor.value);const dia=parseInt(f.dia.value);
    const patch={nome:nm,dia:dia>=1&&dia<=31?dia:null,cartao:f.cartao.value,icone:f.icone.value,moradia:f.moradia.checked,ordem:ex?ex.ordem:(Math.max(0,...contas().map(c=>c.ordem||0))+1)};
    if(v!=null)patch.valores={[f.mes.value]:v};else if(!ex)patch.valores={};
    closeModal();save({contas:{[id]:patch}});toast(ex?"Conta salva.":"Conta adicionada.");
  }
  if(f.id==="ffat"){
    const cid=f.card.value;const fat={};
    for(const inp of f.querySelectorAll("#ff-months input")){const v=parseBR(inp.value);fat[inp.name.slice(2)]=v&&v>0?v:null}
    closeModal();save({cartoes:{[cid]:{faturas:fat}}});toast("Faturas salvas.");
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="ff-card"){const k=S.data.cartoes[t.value];if(!k)return;const tmp=Object.assign({id:t.value},k);document.querySelectorAll("#ff-months input").forEach(inp=>{const m=inp.name.slice(2);const ev=explicit(k.faturas,m);inp.value=ev&&ev>0?fmtIn(ev):"";inp.placeholder=fmtIn(fatura(tmp,m).parc)+" (parcelas)"});return}
  if(!S.canWrite||!t.closest("#main"))return;
  const d=t.dataset;
  if(d.sal){save({salarios:{[d.sal]:{[d.m]:parseBR(t.value)}}});return}
  if(d.fat){const v=parseBR(t.value);save({cartoes:{[d.fat]:{faturas:{[d.m]:v&&v>0?v:null}}}});return}
  if(d.conta){save({contas:{[d.conta]:{valores:{[d.m]:parseBR(t.value)}}}});return}
  if(d.p){save({pessoas:{[d.p]:{nome:t.value.trim()||(d.p==="eu"?"Matheus":"Ana")}}});return}
  if(d.res){save({reserva:{[d.res]:parseBR(t.value)||0}});return}
  if(d.card){const f=d.f;let v=t.value.trim();if(f==="vence"){const n=parseInt(v);v=n>=1&&n<=31?n:null}else v=v||"Cartão";save({cartoes:{[d.card]:{[f]:v}}});return}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(!$("#ov").hidden)closeModal();else if(S.menu){S.menu=null;render()}}
  if(e.key==="Enter"&&e.target.matches&&e.target.matches(".cin input")){e.preventDefault();e.target.blur()}
});
document.addEventListener("focusout",()=>{setTimeout(()=>{const ae=document.activeElement;if(S.pending&&$("#ov").hidden&&!(ae&&/INPUT|SELECT/.test(ae.tagName))){S.pending=false;render()}},50)});
function fromHash(){const h=(location.hash||"").slice(1);S.view=VIEWS.includes(h)?h:"visao"}
window.addEventListener("hashchange",()=>{fromHash();render()});
mq.addEventListener("change",()=>{S.menu=null;render()});
fromHash();init();
})();
</script>
